name: Detox Android E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: detox-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: '36'
  ANDROID_TARGET: google_apis
  ANDROID_ARCH: x86_64
  AVD_NAME: Pixel_9_Pro_API_36
  # Bump to invalidate the cached AVD snapshot after changing emulator options.
  AVD_CACHE_VERSION: v1

  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=2048m"'
  ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
  EXPO_NO_TELEMETRY: '1'

jobs:
  detox-android:
    name: Build & run Detox E2E on Android
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        run: pnpm exec expo prebuild --platform android --no-install
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
          # setup-gradle is read-only outside the default branch by default,
          # which would leave this branch without a warm cache.
          cache-read-only: false

      - name: Build app and androidTest APKs
        run: pnpm detox:android:build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.AVD_CACHE_VERSION }}-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_TARGET }}-${{ env.ANDROID_ARCH }}-${{ hashFiles('.github/scripts/bootstrap-emulator.sh') }}

      # On a cache miss, boot once, seed emulator state, and save a snapshot so
      # subsequent runs start from it instead of doing a cold boot.
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          avd-name: ${{ env.AVD_NAME }}
          ram-size: 4096M
          cores: 2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: bash .github/scripts/bootstrap-emulator.sh

      - name: Run Detox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          avd-name: ${{ env.AVD_NAME }}
          ram-size: 4096M
          cores: 2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            bash .github/scripts/bootstrap-emulator.sh
            pnpm detox:android:test --cleanup --record-videos failing --record-logs failing --take-screenshots failing --artifacts-location artifacts

      - name: Upload Detox artifacts (recordings, logs, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-android-artifacts-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
