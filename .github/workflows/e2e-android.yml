name: E2E Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  e2e-android:
    name: Detox E2E (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DETOX_E2E_BUILD: 'true'
      EXPO_PUBLIC_DETOX_E2E_BUILD: 'true'
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild Android project
        run: |
          pnpm exec expo prebuild \
            --platform android

      - name: Configure Gradle
        working-directory: android
        run: |
          cat >> gradle.properties <<'EOF'

          # CI memory configuration
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=4

          # Hermes
          hermesEnabled=true
          EOF

          echo "gradle.properties:"
          cat gradle.properties

      - name: Test Expo autolinking
        run: |
          pnpm exec expo-modules-autolinking resolve \
            --platform android \
            --json

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          echo "KVM:"
          ls -la /dev/kvm || true

      - name: Install emulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0

      - name: Build APK with Detox
        run: |
          echo "Starting Detox build..."
          pnpm e2e:build:android 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT_CODE"

      - name: Check Gradle build errors
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "=== Full build.log output ==="
            cat build.log
          else
            echo "build.log not found - checking last 100 lines of system output"
          fi

      - name: Debug Check build outputs
        if: always()
        run: |
          echo "=== Looking for ALL APKs in android/app/build ==="
          find android/app/build -type f -name "*.apk" 2>/dev/null | sort || echo "No APKs found"
          echo ""
          echo "=== android/app/build/outputs structure ==="
          find android/app/build/outputs -type d 2>/dev/null | head -30 || echo "Directory not found"
          echo ""
          echo "=== Full contents of apk directory ==="
          find android/app/build/outputs/apk -type f 2>/dev/null || echo "No apk outputs found"

      - name: Run Detox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: Pixel_10_Pro
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: |
            adb wait-for-device

            echo "Android device:"
            adb shell getprop ro.product.model
            adb shell getprop ro.build.version.sdk

            echo "Running Detox..."

            adb reverse tcp:8099 tcp:8099

            pnpm e2e:test:android

      - name: Upload Detox artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: android-detox-artifacts
          path: |
            .artifacts
            android/app/build/outputs
          if-no-files-found: ignore
          retention-days: 7
