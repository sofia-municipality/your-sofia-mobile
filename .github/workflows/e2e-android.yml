name: E2E Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  e2e-android:
    name: Detox E2E (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DETOX_E2E_BUILD: 'true'
      EXPO_PUBLIC_DETOX_E2E_BUILD: 'true'
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild Android project
        run: pnpm exec expo prebuild --platform android

      - name: Configure Gradle memory
        working-directory: android
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          EOF

      - name: Build Detox APKs
        working-directory: android
        run: |
          export LINT_PRINT_STACKTRACE=true
          ./gradlew \
            :app:assembleRelease \
            :app:assembleAndroidTest \
            -DtestBuildType=release \
            --stacktrace

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0

      - name: Run Detox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          avd-name: Pixel_10_Pro
          cores: 4
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          run: |
            adb reverse tcp:8099 tcp:8099
            pnpm e2e:test:android

      - name: Upload Detox artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: android-detox-artifacts
          path: .artifacts
          if-no-files-found: ignore
