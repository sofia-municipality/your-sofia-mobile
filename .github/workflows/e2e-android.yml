name: E2E Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

jobs:
  e2e-android:
    name: Detox E2E (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Gates a network security config (see plugins/withDetoxAndroid.js)
      # that allows cleartext traffic to 10.0.2.2 — the emulator's own
      # host alias. Android blocks cleartext to any non-loopback address
      # by default; `adb reverse`'s tunneled "localhost" is exempt
      # (loopback) but this runner's adb-reverse tunnel never actually
      # passes traffic, so DETOX_DEVICE_SERVER_HOST (via
      # patches/detox@20.51.4.patch) points the app at 10.0.2.2 instead,
      # bypassing the tunnel entirely.
      DETOX_E2E_BUILD: 'true'
      DETOX_DEVICE_SERVER_HOST: 10.0.2.2
      # Read by lib/Map.tsx (inlined into the JS bundle at build time, same
      # as this repo's other EXPO_PUBLIC_* vars) to swap real MapViews for
      # an inert stub — see that file for why.
      EXPO_PUBLIC_DETOX_E2E_BUILD: 'true'
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Detox APKs
        run: pnpm e2e:build:android

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libpulse0

      - name: Run Detox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          avd-name: Pixel_10_Pro
          # ubuntu-latest runners have 4 vCPUs; the default of 2 makes cold
          # app-launch slower than it needs to be.
          cores: 4
          # A freshly created AVD boots with the device not yet marked
          # "provisioned"/setup-complete and the keyguard still up. Espresso
          # then hits a hard-coded, non-configurable 10s wait ("Waited for
          # the root of the view hierarchy to have window focus...") because
          # our Activity's window never becomes the focused one — some
          # other system window still owns focus. Explicitly finishing
          # "setup" and dismissing the keyguard before testing starts is the
          # standard fix for this on freshly-created CI emulators — but a
          # single dismiss-keyguard call still raced the keyguard/SystemUI
          # finishing its own post-boot initialization on some runs (still
          # observed the same 10s window-focus failure intermittently after
          # boot_completed was already signalled). Retrying it for ~10s
          # closes that race. Kept on one line (see below for why):
          # android-emulator-runner runs each line of a multi-line script as
          # its own separate invocation, so splitting these across lines
          # would drop them from the `||` logcat-dump fallback that has to
          # cover the whole sequence.
          script: adb shell svc power stayon true && adb shell settings put global device_provisioned 1 && adb shell settings put secure user_setup_complete 1 && for i in 1 2 3 4 5; do adb shell wm dismiss-keyguard; adb shell input keyevent 82; sleep 2; done && pnpm e2e:test:android || (echo "--- adb logcat ---"; adb logcat -d; exit 1)

      - name: Upload Detox artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: android-detox-artifacts
          path: .artifacts
          if-no-files-found: ignore
