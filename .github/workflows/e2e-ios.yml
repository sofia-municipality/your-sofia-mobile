name: E2E iOS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  e2e-ios:
    name: Detox E2E (iOS)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: ios

      - name: Build Detox iOS app
        run: pnpm e2e:build:ios

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          # Homebrew tap trust became strict on GitHub runners.
          brew tap aws/tap
          brew trust wix/brew
          brew trust aws/tap
          brew install applesimutils

      - name: Build Detox framework cache

        run: npx detox clean-framework-cache && npx detox build-framework-cache

      - name: Run Detox tests on iOS simulator
        run: pnpm e2e:test:ios
